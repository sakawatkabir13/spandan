# Install on the application host after substituting its private IP and certificate paths.
# The public virtual host must never forward /api/v1/internal/.
server {
    listen APP_PRIVATE_IP:8443 ssl;
    server_name APP_PRIVATE_IP;
    ssl_certificate /etc/spandan-chat/tls/service-cert.pem;
    ssl_certificate_key /etc/spandan-chat/tls/service-key.pem;
    ssl_client_certificate /etc/spandan-chat/tls/ca.pem;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    allow MCP_PRIVATE_IP;
    deny all;
    access_log off;
    client_max_body_size 64k;
    location ^~ /api/v1/internal/chat-tools/ {
        proxy_pass http://127.0.0.1:18001;
        proxy_set_header Host backend;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }
    location / { return 404; }
}
