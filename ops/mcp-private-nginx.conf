# Install only on the dedicated MCP host. Nothing is bound to its public address.
server {
    listen MCP_PRIVATE_IP:8443 ssl;
    server_name MCP_PRIVATE_IP;
    ssl_certificate /etc/spandan-mcp/tls/service-cert.pem;
    ssl_certificate_key /etc/spandan-mcp/tls/service-key.pem;
    ssl_client_certificate /etc/spandan-mcp/tls/ca.pem;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    allow APP_PRIVATE_IP;
    deny all;
    access_log off;
    client_max_body_size 64k;
    location /mcp {
        proxy_pass http://127.0.0.1:18800;
        proxy_set_header Host MCP_PRIVATE_IP;
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
    location /health/ {
        proxy_pass http://127.0.0.1:18800;
    }
    location / { return 404; }
}
