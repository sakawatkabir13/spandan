# Overlay for the existing TLS proxy and legacy persistent volumes on this VPS.
services:
  db:
    container_name: spandan_db
    logging: &bounded_logs
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  backend:
    container_name: spandan_backend
    logging: *bounded_logs
  frontend:
    container_name: spandan_frontend
    ports: !override
      - 127.0.0.1:8082:8080
    logging: *bounded_logs
volumes:
  pgdata:
    external: true
    name: spandan_pgdata
  backend_uploads:
    external: true
    name: spandan_backend_uploads
