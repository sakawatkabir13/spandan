name: Bug Report
description: Report a reproducible bug in Spandan.
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the sections below
        so we can reproduce and fix it quickly.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Run command '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include stack traces, screenshots, or logs.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Docker version, browser, etc.
      placeholder: "Ubuntu 22.04, Docker 24.x, Chrome 126"
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      multiple: false
      options:
        - Backend API
        - Frontend
        - Database / Migrations
        - AI Triage
        - Docker / Infrastructure
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched existing issues and there is no duplicate.
          required: true
        - label: I have reproduced the bug against the latest `main` branch.
          required: true
        - label: I have included relevant logs or screenshots.
          required: false
