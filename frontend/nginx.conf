limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=20r/m;

server {
    # This container is exposed only to the trusted host TLS proxy on loopback.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;
    limit_req_status 429;
    proxy_read_timeout 40s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: https:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~ ^/api/v1/auth/(?:forgot-password|account-action|verify/.+/request|mfa/.*)$ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params;
    }

    location /api/v1/events/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params;
        proxy_buffering off;
        proxy_read_timeout 310s;
    }

    location = /api/v1/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params;
    }

    location = /api/v1/auth/register/patient {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params;
    }

    location = /api/v1/auth/register/doctor {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params;
    }

    location = /api/v1/ai/symptom-check {
        limit_req zone=ai_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params;
    }

    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location /health {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params;
    }

    location ^~ /uploads/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params;
        expires 1d;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        try_files $uri =404;
        expires 1y;
    }

    location ~ ^/(?:docs|redoc|openapi\.json)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
