# Production stack behind a host HTTPS reverse proxy.
name: spandan

x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    container_name: spandan_db
    logging: *bounded-logs
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - private

  backend:
    container_name: spandan_backend
    logging: *bounded-logs
    image: spandan-backend:${RELEASE_TAG:-production}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DEMO_MODE: ${DEMO_MODE:-false}
      APP_NAME: Spandan
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Dhaka}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_DOCS: "false"
      FORCE_HTTPS: "false"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL:?Set BACKEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS}
      AI_PROVIDER: ${AI_PROVIDER:-bedrock}
      AI_ENABLED: ${AI_ENABLED:-true}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      AWS_USE_INSTANCE_ROLE: ${AWS_USE_INSTANCE_ROLE:-false}
      BEDROCK_TRIAGE_MODEL: ${BEDROCK_TRIAGE_MODEL:-openai.gpt-oss-120b-1:0}
      BEDROCK_CHAT_MODEL: ${BEDROCK_CHAT_MODEL:-openai.gpt-oss-20b-1:0}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-20}
      AI_TOTAL_TIMEOUT_SECONDS: ${AI_TOTAL_TIMEOUT_SECONDS:-25}
      CHAT_ENABLED: ${CHAT_ENABLED:-false}
      CHAT_EVALUATION_FILE: ${CHAT_EVALUATION_FILE:-/run/chat/chat-evaluation.json}
      CHAT_ENCRYPTION_KEY: ${CHAT_ENCRYPTION_KEY:-}
      CHAT_SIGNING_PRIVATE_KEY: ${CHAT_SIGNING_PRIVATE_KEY:-}
      CHAT_MCP_URL: ${CHAT_MCP_URL:-}
      CHAT_MCP_SERVICE_TOKEN: ${CHAT_MCP_SERVICE_TOKEN:-}
      CHAT_TLS_CA: ${CHAT_TLS_CA:-}
      CHAT_TLS_CERT: ${CHAT_TLS_CERT:-}
      CHAT_TLS_KEY: ${CHAT_TLS_KEY:-}
      CHAT_TURNS_PER_MINUTE: ${CHAT_TURNS_PER_MINUTE:-10}
      CHAT_TURNS_PER_DAY: ${CHAT_TURNS_PER_DAY:-100}
      CHAT_MAX_TOOL_CALLS: ${CHAT_MAX_TOOL_CALLS:-6}
      CHAT_MAX_OUTPUT_TOKENS: ${CHAT_MAX_OUTPUT_TOKENS:-1500}
      CHAT_DEADLINE_SECONDS: ${CHAT_DEADLINE_SECONDS:-60}
      CHAT_INPUT_PRICE_PER_MILLION: ${CHAT_INPUT_PRICE_PER_MILLION:-0.07}
      CHAT_OUTPUT_PRICE_PER_MILLION: ${CHAT_OUTPUT_PRICE_PER_MILLION:-0.30}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      OPERATOR_NAME: ${OPERATOR_NAME:-Spandan}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-community.cuetinsights@gmail.com}
      SYMPTOM_RETENTION_DAYS: ${SYMPTOM_RETENTION_DAYS:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-community.cuetinsights@gmail.com}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      STRIPE_MODE: test
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-bdt}
      VIDEO_BASE_URL: ${VIDEO_BASE_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-south-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-5}
      MAX_REQUEST_SIZE_BYTES: ${MAX_REQUEST_SIZE_BYTES:-6291456}
      EMERGENCY_CONTACT_NUMBER: ${EMERGENCY_CONTACT_NUMBER:-999}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SEED_DEMO_DATA: "false"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - backend_uploads:/app/uploads
      - ./.runtime/chat:/run/chat:ro
    ports:
      - "127.0.0.1:${INTERNAL_API_PORT:-18001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - private

  frontend:
    container_name: spandan_frontend
    logging: *bounded-logs
    image: spandan-frontend:${RELEASE_TAG:-production}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_LISTEN_HOST:-127.0.0.1}:${HTTP_LISTEN_PORT:-8082}:8080"
    networks:
      - private

volumes:
  pgdata:
    name: ${POSTGRES_VOLUME_NAME:-spandan_pgdata}
  backend_uploads:
    name: ${UPLOADS_VOLUME_NAME:-spandan_backend_uploads}

networks:
  private:
    driver: bridge
