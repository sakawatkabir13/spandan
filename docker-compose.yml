services:
  db:
    image: postgres:16-alpine
    container_name: spandan_db
    restart: always
    environment:
      POSTGRES_USER: spandan
      POSTGRES_PASSWORD: spandan
      POSTGRES_DB: spandan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spandan -d spandan"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spandan_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_NAME: Spandan
      APP_TIMEZONE: Asia/Dhaka
      DATABASE_URL: postgresql+asyncpg://spandan:spandan@db:5432/spandan
      JWT_SECRET_KEY: spandan-super-secret-jwt-key-for-development-only-change-in-prod
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      GROQ_API_KEY: ${GROQ_API_KEY:-your_groq_api_key_here}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      UPLOAD_DIR: uploads
      MAX_UPLOAD_SIZE_MB: 5
      EMERGENCY_CONTACT_NUMBER: 999
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    command: >
      bash -c "alembic upgrade head && python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spandan_frontend
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  backend_uploads:
