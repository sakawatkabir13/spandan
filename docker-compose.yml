services:
  db:
    image: postgres:16-alpine
    container_name: spandan_db
    restart: always
    environment:
      POSTGRES_USER: spandan
      POSTGRES_PASSWORD: spandan
      POSTGRES_DB: spandan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spandan -d spandan"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: spandan_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: Spandan
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Dhaka}
      DATABASE_URL: postgresql+asyncpg://spandan:spandan@db:5432/spandan
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-spandan-super-secret-jwt-key-for-development-only-change-in-prod}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-20}
      GROQ_MAX_RETRIES: ${GROQ_MAX_RETRIES:-2}
      UPLOAD_DIR: uploads
      MAX_UPLOAD_SIZE_MB: 5
      EMERGENCY_CONTACT_NUMBER: "${EMERGENCY_CONTACT_NUMBER:-999}"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    command: >
      bash -c "alembic upgrade head && if [ \"$$SEED_DEMO_DATA\" = \"true\" ]; then python -m scripts.seed; fi && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: spandan_frontend
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  backend_uploads:
